<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Игрушки и аксессуары ручной работы</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --card: #ffffff;
        --text: #222222;
        --muted: #6f6f6f;
        --accent: #8a5a44;
        --accent-2: #6f4634;
        --border: #e7dfd6;
        --ok: #2f7a43;
        --shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        --radius: 18px;
      }

      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial,
          sans-serif;
        background: var(--bg);
        color: var(--text);
        padding: 16px;
      }

      .wrap {
        max-width: 980px;
        margin: 0 auto;
      }

      h1 {
        font-size: 28px;
        line-height: 1.2;
        text-align: center;
        margin: 8px 0 20px;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px;
        flex-wrap: wrap;
      }

      .badge {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 12px;
        font-size: 14px;
        color: var(--muted);
      }

      .actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }

      .btn-link {
        display: inline-block;
        text-decoration: none;
        background: var(--accent);
        color: #fff;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 600;
      }

      .btn-link:hover {
        background: var(--accent-2);
      }

      .catalog {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 18px;
        align-items: stretch;
      }

      .card {
        background: var(--card);
        border-radius: var(--radius);
        overflow: hidden;
        box-shadow: var(--shadow);
        border: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      /* Стили для горизонтальной прокрутки категорий */
      .categories-scroll-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
        -ms-overflow-style: none;
        margin-bottom: 16px;
        padding: 4px 0;
      }

      .categories-scroll-container::-webkit-scrollbar {
        display: none;
      }

      .categories-list {
        display: inline-flex;
        gap: 8px;
        white-space: nowrap;
      }

      .category-tag {
        display: inline-block;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 14px;
        font-weight: 500;
        color: var(--muted);
        cursor: pointer;
        transition: all 0.2s ease;
        user-select: none;
      }

      .category-tag:hover {
        background: var(--border);
      }

      .category-tag.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      .slider-container {
        position: relative;
        width: 100%;
        height: 300px;
        overflow: hidden;
        background: #f2ece4;
      }

      .slider {
        display: flex;
        width: 100%;
        height: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        -ms-overflow-style: none;
        scrollbar-width: none;
      }

      .slider::-webkit-scrollbar {
        display: none;
      }

      .slider img {
        width: 100%;
        height: 100%;
        flex-shrink: 0;
        object-fit: cover;
        scroll-snap-align: start;
        background: #f0ebe4;
      }

      .no-photo {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
        color: var(--muted);
        font-size: 15px;
        padding: 20px;
        text-align: center;
      }

      .slider-dots {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: 12px;
        display: flex;
        gap: 6px;
        padding: 6px 10px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.28);
      }

      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.45);
      }

      .dot.active {
        background: #fff;
        transform: scale(1.15);
      }

      .card-info {
        padding: 16px;
        display: grid;
        gap: 10px;
        flex-grow: 1;
      }

      .card-header {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: flex-start;
      }

      .card-title {
        font-size: 18px;
        font-weight: 700;
        line-height: 1.25;
        flex-grow: 1;
      }

      .card-desc {
        color: var(--muted);
        font-size: 14px;
        line-height: 1.45;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
        overflow: hidden;
      }

      .card-desc.full {
        display: block;
        -webkit-line-clamp: unset;
        -webkit-box-orient: unset;
        overflow: visible;
      }

      .read-more {
        color: var(--accent);
        cursor: pointer;
        font-weight: 600;
        font-size: 13px;
        text-decoration: underline;
        margin-top: 4px;
        display: inline-block;
      }

      .card-status-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 4px;
      }

      .card-price {
        white-space: nowrap;
        color: var(--accent);
        font-size: 18px;
        font-weight: 700;
      }

      .card-status {
        font-size: 13px;
        font-weight: 600;
      }

      .status-in-stock {
        color: var(--ok);
      }
      .status-order {
        color: var(--accent);
      }

      .btn-order {
        display: block;
        text-align: center;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        border-radius: 12px;
        padding: 12px;
        font-weight: 700;
        margin-top: 4px;
      }

      .btn-order:hover {
        background: var(--accent-2);
      }

      .empty,
      .error-box {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        color: var(--muted);
        text-align: center;
      }

      .modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(0, 0, 0, 0.6);
        display: none;
        place-items: center;
        z-index: 1000;
        padding: 20px;
      }

      .modal-overlay.active {
        display: grid;
      }

      .modal {
        background: var(--card);
        border-radius: var(--radius);
        padding: 24px;
        max-width: 500px;
        width: 100%;
        max-height: 80vh;
        overflow-y: auto;
        box-shadow: var(--shadow);
      }

      .modal-title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 12px;
      }

      .modal-desc {
        color: var(--muted);
        font-size: 15px;
        line-height: 1.6;
        white-space: pre-wrap;
      }

      .modal-close {
        margin-top: 16px;
        width: 100%;
      }

      @media (max-width: 640px) {
        body {
          padding: 12px;
        }
        h1 {
          font-size: 22px;
        }
        .slider-container {
          height: 240px;
        }
        .modal {
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>Игрушки и аксессуары ручной работы</h1>

      <div class="topbar">
        <div class="badge" id="adminBadge" style="display:none;">Витрина · 
          <a
            href="/health"
            >API
          </a
          ></div>
        <div class="actions" id="adminActions" style="display:none;">
          <a
            class="btn-link"
            href="/docs"
            >Swagger API</a
          >
          <a
            class="btn-link"
            href="/admin/"
            >Админка</a
          >
        </div>
      </div>

      <!-- Категории (теги с горизонтальной прокруткой) -->
      <div id="categoriesContainer" class="categories-scroll-container">
        <div id="categoriesList" class="categories-list"></div>
      </div>

      <div id="catalog" class="catalog"></div>
    </div>

    <!-- Модальное окно для полного описания -->
    <div id="modalOverlay" class="modal-overlay">
      <div class="modal">
        <div id="modalTitle" class="modal-title"></div>
        <div id="modalDesc" class="modal-desc"></div>
        <button class="btn-order modal-close" onclick="closeModal()">Закрыть</button>
      </div>
    </div>

    <script src="./config.js"></script>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script>
      const tg = window.Telegram?.WebApp || null;

      tg.ready();
      if (tg) tg.expand();

      // Проверяем, является ли пользователь администратором группы
      let isAdminUser = false;
      
      async function checkAdminStatus() {
        try {
          // Получаем данные пользователя из Telegram WebApp
          const user = tg.initDataUnsafe?.user;
          if (!user || !user.id) {
            return false;
          }

          // Отправляем запрос на API для проверки статуса администратора
          const response = await fetch('/check-admin', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-Telegram-User-Id': String(user.id)
            },
            body: JSON.stringify({ user_id: user.id })
          });
          
          if (response.ok) {
            const data = await response.json();
            return data.is_admin === true;
          }
          return false;
        } catch (error) {
          console.error('Ошибка проверки статуса администратора:', error);
          return false;
        }
      }

      // Отображаем админские кнопки только если пользователь администратор
      async function initAdminUI() {
        const adminStatus = await checkAdminStatus();
        if (adminStatus) {
          document.getElementById('adminBadge').style.display = 'block';
          document.getElementById('adminActions').style.display = 'flex';
        }
      }
      
      // Запускаем проверку при загрузке
      initAdminUI();

      // Перехват кликов по ссылкам для открытия внутри TG App
      document.addEventListener('click', function(e) {
        const link = e.target.closest('a[href]');
        if (!link) return;

        const href = link.getAttribute('href');

        // Если это внешняя ссылка (начинается с http:// или https://)
        if (href.startsWith('http://') || href.startsWith('https://')) {
          e.preventDefault();
          // Открываем ссылку внутри Telegram используя MainButton или просто переходим
          tg.openLink(href);
        }
        // Внутренние ссылки обрабатываются браузером по умолчанию
      });

      const CONFIG = window.APP_CONFIG || {};
      const API_BASE = CONFIG.API_BASE || "/";
      const MEDIA_BASE = CONFIG.MEDIA_BASE || "/media/";
      const PRODUCTS_ENDPOINT = CONFIG.PRODUCTS_ENDPOINT || "products/public/";
      const CATEGORIES_ENDPOINT = CONFIG.CATEGORIES_ENDPOINT || "categories/public/";
      const ADMIN_USERNAME = "katerinka_exbro";

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      // Загрузка и отображение категорий
      async function loadCategories() {
        try {
          const response = await fetch(`${API_BASE}${CATEGORIES_ENDPOINT}`);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }
          const categories = await response.json();

          const container = document.getElementById("categoriesList");
          if (!Array.isArray(categories) || categories.length === 0) {
            return;
          }

          // Добавляем тег "Все" для сброса фильтра
          const allTagHtml = `<div class=\"category-tag active\" data-category-id=\"\">Все</div>`;
          container.insertAdjacentHTML("beforeend", allTagHtml);

          // Добавляем остальные категории
          categories.forEach(cat => {
            const tagHtml = `<div class=\"category-tag\" data-category-id=\"${cat.id}\">${escapeHtml(cat.name)}</div>`;
            container.insertAdjacentHTML("beforeend", tagHtml);
          });

          // Добавляем обработчики кликов
          container.querySelectorAll(".category-tag").forEach(tag => {
            tag.addEventListener("click", function() {
              // Снимаем активный класс со всех тегов
              container.querySelectorAll(".category-tag").forEach(t => t.classList.remove("active"));
              // Добавляем активный класс нажатому тегу
              this.classList.add("active");
              // Фильтруем товары
              const categoryId = this.getAttribute("data-category-id");
              filterProducts(categoryId);
            });
          });
        } catch (error) {
          console.error("Ошибка загрузки категорий:", error);
        }
      }

      let allProducts = [];

      function statusMeta(status) {
        if (status === "in_stock") {
          return { text: "В наличии", className: "status-in-stock" };
        }
        if (status === "order") {
          return { text: "Под заказ", className: "status-order" };
        }
        return { text: status || "Не указан", className: "" };
      }

      function updateDots(productIndex, sliderElement) {
        const width = sliderElement.offsetWidth || 1;
        const activeIndex = Math.round(sliderElement.scrollLeft / width);
        const dotsContainer = document.getElementById(`dots-${productIndex}`);
        if (!dotsContainer) return;
        dotsContainer.querySelectorAll(".dot").forEach((dot, index) => {
          dot.classList.toggle("active", index === activeIndex);
        });
      }
      window.updateDots = updateDots;

      function buildImageSlides(product, pIndex) {
        const images = Array.isArray(product.images) ? product.images : [];
        if (!images.length) {
          return {
            imagesHtml: `<div class="no-photo">Фото пока не добавлено</div>`,
            dotsHtml: "",
          };
        }

        let imagesHtml = "";
        let dotsHtml = "";

        images.forEach((imgUrl, iIndex) => {
          const fullImgUrl = `${MEDIA_BASE}/${imgUrl}`;
          imagesHtml += `<img src="${fullImgUrl}" alt="${escapeHtml(product.title)} ${iIndex + 1}" loading="lazy" onerror="this.style.display='none';">`;

          if (images.length > 1) {
            dotsHtml += `<div class="dot ${iIndex === 0 ? "active" : ""}"></div>`;
          }
        });

        return { imagesHtml, dotsHtml };
      }

      function buildOrderUrl(product) {
        const priceText =
          product.price != null ? `${product.price} руб` : "цену уточнить";
        const text = `Здравствуйте! Хочу заказать: ${product.title}. Цена: ${priceText}.`;
        return `https://t.me/${ADMIN_USERNAME}?text=${encodeURIComponent(text)}`;
      }

      function closeModal() {
        const overlay = document.getElementById("modalOverlay");
        overlay.classList.remove("active");
      }

      function openModal(title, description) {
        const overlay = document.getElementById("modalOverlay");
        const titleEl = document.getElementById("modalTitle");
        const descEl = document.getElementById("modalDesc");
        
        titleEl.textContent = title;
        descEl.textContent = description || "Описание отсутствует";
        overlay.classList.add("active");
      }

      function renderProducts(products) {
        const container = document.getElementById("catalog");
        container.innerHTML = "";

        if (!Array.isArray(products) || products.length === 0) {
          container.innerHTML = `<div class="empty">Пока товаров нет. Добавь первый товар через админку.</div>`;
          return;
        }

        products.forEach((product, pIndex) => {
          const { text, className } = statusMeta(product.status);
          const { imagesHtml, dotsHtml } = buildImageSlides(product, pIndex);
          const orderUrl = buildOrderUrl(product);
          
          // Проверяем, нужно ли показывать кнопку "Подробнее"
          const description = product.description || "";
          const needsReadMore = description.length > 100;
          const readMoreButton = needsReadMore 
            ? `<div class="read-more" onclick="openModal('${escapeHtml(product.title)}', '${escapeHtml(description).replace(/'/g, "\\'")}')">Подробнее</div>`
            : "";

          const cardHtml = `
          <article class="card">
            <div class="slider-container">
              <div class="slider" id="slider-${pIndex}" onscroll="updateDots(${pIndex}, this)">
                ${imagesHtml}
              </div>
              ${dotsHtml ? `<div class="slider-dots" id="dots-${pIndex}\">${dotsHtml}</div>` : ""}
            </div>

            <div class="card-info">
              <div class="card-header">
                <div class="card-title">${escapeHtml(product.title)}</div>
              </div>

              <div class="card-desc">${escapeHtml(description.substring(0, 100))}${needsReadMore ? "..." : ""}</div>
              ${readMoreButton}
              
              <div class="card-status-row">
                <div class="card-status ${className}">${text}</div>
                <div class="card-price">${product.price != null ? `${product.price} руб` : "—"}</div>
              </div>

              <a href="${orderUrl}" class="btn-order">Заказать</a>
            </div>
          </article>
        `;

          container.insertAdjacentHTML("beforeend", cardHtml);
        });
      }

      async function loadProducts() {
        const container = document.getElementById("catalog");
        container.innerHTML = `<div class="empty">Загружаем товары...</div>`;

        try {
          const response = await fetch(`${API_BASE}${PRODUCTS_ENDPOINT}`);
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const products = await response.json();
          allProducts = products;
          renderProducts(products);
        } catch (error) {
          console.error(error);
          container.innerHTML = `<div class="error-box">Не удалось загрузить товары. Проверь API на /api/health/.</div>`;
        }
      }

      function filterProducts(categoryId) {
        if (!categoryId || categoryId === "") {
          renderProducts(allProducts);
        } else {
          const filtered = allProducts.filter(p => p.category_id == categoryId);
          renderProducts(filtered);
        }
      }

      // Загружаем категории и товары
      loadCategories();
      loadProducts();
    </script>
  </body>
</html>
