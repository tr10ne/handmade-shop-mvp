<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Игрушки и Аксессуары Ручной Работы</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      :root {
        --bg-color: var(--tg-theme-bg-color, #f5f5f5);
        --text-color: var(--tg-theme-text-color, #222222);
        --hint-color: var(--tg-theme-hint-color, #777777);
        --btn-color: var(--tg-theme-button-color, #2481cc);
        --btn-text: var(--tg-theme-button-text-color, #ffffff);
        --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica,
          Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
        margin: 0;
        padding: 12px;
      }
      h1 {
        font-size: 20px;
        text-align: center;
        margin-bottom: 16px;
        margin-top: 5px;
      }

      /* Сетка товаров (делаем 1 колонку, чтобы карусель с деталями смотрелась крупно и красиво) */
      .catalog {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      .card {
        background: var(--card-bg);
        border-radius: 16px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.04);
      }

      /* Контейнер карусели */
      .slider-container {
        position: relative;
        width: 100%;
        height: 280px; /* Увеличили высоту для сочных фото */
        overflow: hidden;
      }
      .slider {
        display: flex;
        width: 100%;
        height: 100%;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        scroll-behavior: smooth;
        /* Прячем дефолтный скроллбар */
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      .slider::-webkit-scrollbar {
        display: none;
      }
      .slider img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        flex-shrink: 0;
        scroll-snap-align: start;
      }

      /* Индикатор свайпа (точки) */
      .slider-dots {
        position: absolute;
        bottom: 10px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 6px;
        background: rgba(0, 0, 0, 0.3);
        padding: 4px 8px;
        border-radius: 10px;
        pointer-events: none;
      }
      .dot {
        width: 6px;
        height: 6px;
        background: rgba(255, 255, 255, 0.5);
        border-radius: 50%;
        transition: all 0.2s;
      }
      .dot.active {
        background: #ffffff;
        transform: scale(1.2);
      }

      /* Блок информации */
      .card-info {
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .card-header {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }
      .card-title {
        font-size: 18px;
        font-weight: bold;
        margin: 0;
      }
      .card-price {
        font-size: 18px;
        color: var(--btn-color);
        font-weight: bold;
        white-space: nowrap;
      }
      .card-desc {
        font-size: 13px;
        color: var(--hint-color);
        line-height: 1.4;
        margin: 4px 0;
      }
      .card-status {
        font-size: 12px;
        font-weight: 500;
      }

      .btn-order {
        background-color: var(--btn-color);
        color: var(--btn-text);
        border: none;
        padding: 12px;
        border-radius: 10px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
        text-align: center;
        margin-top: 10px;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Мастерская игрушек</h1>
    <div class="catalog" id="catalog"></div>

    <script>
      const tg = window.Telegram.WebApp;
      tg.expand();

      const telegramAdminUsername = "katerinka_exbro";

      async function loadProducts() {
        try {
          const response = await fetch("products.json");
          const products = await response.json();
          const catalogContainer = document.getElementById("catalog");

          products.forEach((product, pIndex) => {
            const statusText =
              product.status === "in_stock" ? "🟢 В наличии" : "⏳ Под заказ";
            const messageText = `Здравствуйте! Хочу заказать игрушку: "${product.title}" (${product.price}).`;
            const encodedText = encodeURIComponent(messageText);
            const orderUrl = `https://t.me/${telegramAdminUsername}?text=${encodedText}`;

            // Генерируем теги изображений для слайдера
            let imagesHtml = "";
            let dotsHtml = "";

            product.images.forEach((imgUrl, iIndex) => {
              imagesHtml += `<img src="${imgUrl}" alt="${product.title}">`;
              // Точки-индикаторы нужны только если картинок больше одной
              if (product.images.length > 1) {
                dotsHtml += `<div class="dot ${iIndex === 0 ? "active" : ""}" data-p="${pIndex}" data-i="${iIndex}"></div>`;
              }
            });

            // Собираем карточку
            const cardHtml = `
                        <div class="card">
                            <div class="slider-container">
                                <div class="slider" id="slider-${pIndex}" onscroll="updateDots(${pIndex}, this)">
                                    ${imagesHtml}
                                </div>
                                <div class="slider-dots" id="dots-${pIndex}">
                                    ${dotsHtml}
                                </div>
                            </div>
                            <div class="card-info">
                                <div class="card-header">
                                    <div class="card-title">${product.title}</div>
                                    <div class="card-price">${product.price}</div>
                                </div>
                                <div class="card-desc">${product.description || ""}</div>
                                <div class="card-status">${statusText}</div>
                                <a href="${orderUrl}" target="_blank" class="btn-order">Связаться с мастером</a>
                            </div>
                        </div>
                    `;
            catalogContainer.insertAdjacentHTML("beforeend", cardHtml);
          });
        } catch (error) {
          console.error("Ошибка:", error);
          document.getElementById("catalog").innerText =
            "Не удалось загрузить витрину товаров.";
        }
      }

      // Функция переключения активной точки при скролле карусели
      function updateDots(productIndex, sliderElement) {
        const scrollLeft = sliderElement.scrollLeft;
        const width = sliderElement.offsetWidth;
        // Вычисляем индекс текущей картинки на основе скролла
        const activeIndex = Math.round(scrollLeft / width);

        const dotsContainer = document.getElementById(`dots-${productIndex}`);
        const dots = dotsContainer.querySelectorAll(".dot");

        dots.forEach((dot, index) => {
          if (index === activeIndex) {
            dot.classList.add("active");
          } else {
            dot.classList.remove("active");
          }
        });
      }

      loadProducts();
    </script>
  </body>
</html>
